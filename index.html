<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Rock Paper Scissors</h1>
        
        <div class="choices">
            <button onclick="playGame('rock')">✊ Rock</button>
            <button onclick="playGame('paper')">✋ Paper</button>
            <button onclick="playGame('scissors')">✌️ Scissors</button>
        </div>

        <div class="result-box">
            <p id="user-choice">Your Choice: -</p>
            <p id="computer-choice">Computer's Choice: -</p>
            <h2 id="outcome">Choose to start!</h2>
        </div>

        <div class="score">
            <p>Score: <span id="score-val">0</span></p>
            <button id="reset-btn" onclick="resetGame()">Reset Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
